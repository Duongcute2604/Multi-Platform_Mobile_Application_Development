<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Login - Bài tập 1</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F1F5F9; }
  .screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; }
  .form { width: 100%; max-width: 400px; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 24px; }
  .title { font-size: 28px; font-weight: 700; color: #0F172A; text-align: center; margin: 0; }
  .subtitle { font-size: 15px; color: #64748B; text-align: center; margin: 8px 0 24px; }
  .label { font-size: 14px; font-weight: 600; color: #0F172A; margin-bottom: 6px; }
  .input { display: block; width: 100%; height: 48px; border: 1px solid #E2E8F0; border-radius: 12px; padding: 0 16px; font-size: 15px; color: #0F172A; background: #F8FAFC; margin-bottom: 16px; font-family: inherit; }
  .input::placeholder { color: #64748B; }
  .forgot { display: block; text-align: right; color: #2563EB; font-size: 14px; font-weight: 600; padding: 4px 0 8px; text-decoration: none; }
  .button { background: #2563EB; border-radius: 12px; padding: 14px; text-align: center; color: #fff; font-size: 16px; font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="form">
      <h1 class="title">My App</h1>
      <p class="subtitle">Đăng nhập để tiếp tục</p>

      <div class="label">Email</div>
      <input class="input" placeholder="example@email.com">

      <div class="label">Mật khẩu</div>
      <input class="input" type="password" placeholder="Nhập mật khẩu">

      <a class="forgot" href="#">Forgot password?</a>
      <div class="button">Đăng nhập</div>
    </div>
  </div>
</body>
</html>
